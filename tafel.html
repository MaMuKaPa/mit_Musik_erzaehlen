<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tafelbilder – Mit Musik erzählen</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f1ee;--fg:#1c1c1a;--card:#fff;--line:#c9c9c4;--acc:#1E88E5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161718;--fg:#ececea;--card:#222426;--line:#3b3e41}}
:root[data-theme="dark"]{--bg:#161718;--fg:#ececea;--card:#222426;--line:#3b3e41}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 "Trebuchet MS","Segoe UI",Arial,sans-serif}
.wrap{max-width:1250px;margin:0 auto;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button,select,input,textarea{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,td:focus-visible{outline:3px solid #FDD835;outline-offset:2px}
.sheet{background:#fff;color:#1c1c1a;border-radius:10px;padding:16px;border:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:1.9rem}.name{font-size:1.1rem}
.scroll{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{border:2px solid #c9c9c4;padding:8px 10px;vertical-align:top;text-align:left;min-width:110px}
td[contenteditable]{background:#fcfcfa;cursor:text}
td:first-child{font-weight:700}
th{color:#1c1c1a}
th svg{width:24px;height:24px;vertical-align:-6px;margin-right:6px}

.bw .col1,.bw .col2,.bw .col3,.bw .col4,.bw .col5{background:#fff!important;color:#000!important}
.bw th span{background:#fff;padding:1px 5px;border-radius:4px}
th svg{color:inherit}.bw th svg{color:#000}
.col0{background:#e4e4e2}.col1{background:#43A047;color:#fff}.col2{background:#E53935;color:#fff}.col3{background:#1E88E5;color:#fff}.col4{background:#FDD835}.col5{background:#cfcfcf}
.ctl{width:44px;min-width:0;border:0;text-align:center}
.panel{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.hint{opacity:.75;font-size:.9rem}
@media print{
 @page{size:A3 landscape;margin:10mm}
 body{background:#fff}.no-print{display:none!important}
 .wrap{max-width:none;padding:0}.sheet{border:0;padding:0}
 tr{break-inside:avoid;page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="bar no-print">
  <button id="tH" class="on">Hörtafel</button>
  <button id="tF">Figuren und Instrumente</button>
  <span style="width:12px"></span>
  <button id="mClass" class="on">Klassenversion (bearbeiten)</button>
  <button id="mSug">Vorschlag (Anregung)</button>
  <button id="mBlank">Leer (Schülerexemplar)</button>
  <select id="cls" aria-label="Klasse wählen"></select> <span id="sync" class="hint" role="status"></span>
  <button id="bw" title="Muster und Symbole statt Farben">Schwarz-Weiß</button>
  <button id="print">Drucken / als PDF speichern</button>
 </div>
 <div class="sheet">
  <div class="head"><h1 id="ttl"></h1><div class="name" id="who"></div></div>
  <div class="scroll"><table id="tbl"></table></div>
  <p id="note" class="hint"></p>
 </div>
 <div class="panel no-print" id="panel">
  <button id="addRow">+ Zeile</button>
  <span class="hint">Zellen antippen und tippen. ✕ löscht eine Zeile. Gespeichert wird im Claude-Konto (wenn angemeldet) und zusätzlich in diesem Browser.</span>
  <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
  <input id="newCls" placeholder="Neue Klasse, z. B. 6c"> <button id="mk">Klasse anlegen</button> <button id="delc">Klasse löschen</button>
  <div style="margin-top:12px"><b>Klassencode (für Gerätewechsel):</b>
   <button id="gen">Code erzeugen</button> <button id="cpy">Kopieren</button> <button id="ld">Code laden</button>
   <textarea id="code" rows="3" style="width:100%;margin-top:6px" placeholder="Code hier einfügen und „Code laden“ tippen"></textarea>
   <span class="hint" id="msg"></span></div>
 </div>
</div>
<script>
const T={
 h:{t:'Hörtafel: Was hören wir?',cols:['Stück','Tempo','Lautstärke','Tonhöhe','Klangfarbe','Wirkung (Plakat)'],
  start:[['Bergkönig (Std 1)'],['Gnomus (Std 3)'],['Bydlo (Std 3)'],['Küken (Std 4)'],['Baba Yaga (Std 4)'],['Das große Tor von Kiew (Std 5)']],
  sug:[
   ['Bergkönig (Std 1)','langsam → sehr schnell (accelerando)','sehr leise → sehr laut (crescendo)','tief → hoch','wenige → viele Instrumente, Blech, Pauken','geheimnisvoll → wild, bedrohlich'],
   ['Gnomus (Std 3)','ruckartig, wechselnd, Pausen','plötzlich laut und leise','hoch und tief im Wechsel','scharf, sprunghaft','unheimlich, aufgeregt'],
   ['Bydlo (Std 3)','gleichmäßig, langsam (bleibt gleich)','leise → laut → leise (crescendo, decrescendo)','tief, schwer','tiefes Blech, wuchtig','kraftvoll, ruhig'],
   ['Küken (Std 4)','schnell, leicht','leise bis mittel','hoch','hell, kurze Töne (staccato)','zart, verspielt'],
   ['Baba Yaga (Std 4)','stampfend, Wechsel','laut und wild, Mittelteil leise','tief und hoch','wuchtig, Schlagzeug, Blech','bedrohlich, wild, geheimnisvoll'],
   ['Das große Tor von Kiew (Std 5)','feierlich, breit','laut, steigernd','tief bis hoch','Tutti (alle), Glocken','feierlich, kraftvoll']]},
 f:{t:'Peter und der Wolf: Figuren und Instrumente',cols:['Figur','Instrument','Familie','Merkmale der Musik'],
  start:[['Peter'],['Vogel'],['Ente'],['Katze'],['Großvater'],['Wolf'],['Jäger']],
  sug:[
   ['Peter','Streicher','Streicher','munter, gleichmäßig'],
   ['Vogel','Querflöte','Holzbläser','hoch, schnell, hell'],
   ['Ente','Oboe','Holzbläser','nasal, gemächlich'],
   ['Katze','Klarinette','Holzbläser','tief, schleichend, staccato'],
   ['Großvater','Fagott','Holzbläser','sehr tief, brummig'],
   ['Wolf','Horn','Blechbläser','tief, mächtig, bedrohlich'],
   ['Jäger','Bläser, Pauken','Blech und Schlagzeug','marschartig, kräftig']]}
};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let mode='class',tab='h',store={},cur='',bw=false;
const ICS={tempo:`<g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><circle cx="120" cy="140" r="80"/><path d="M120 140V90M120 140L160 160"/></g><g fill="currentColor"><rect x="100" y="18" width="40" height="22"/><rect x="112" y="38" width="16" height="22"/><circle cx="120" cy="140" r="10"/></g>`,laut:`<g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M28 95H75L125 52V188L75 145H28Z"/><path d="M173.7 89.4A40 40 0 0 1 173.7 150.6"/><path d="M193 66.4A70 70 0 0 1 193 173.6"/><path d="M212.3 43.4A100 100 0 0 1 212.3 196.6"/></g>`,ton:`<path d="M25 210V170H70V130H115V90H160V50H215V210Z" fill="none" stroke="currentColor" stroke-width="11" stroke-linejoin="round"/>`,farbe:`<g fill="none" stroke="currentColor" stroke-width="11"><ellipse cx="120" cy="122" rx="100" ry="77"/><circle cx="157" cy="142" r="17"/></g><g fill="currentColor"><circle cx="65" cy="95" r="15"/><circle cx="110" cy="75" r="15"/><circle cx="160" cy="88" r="15"/><circle cx="62" cy="145" r="15"/></g>`};
const TI={'Tempo':'tempo','Lautstärke':'laut','Tonhöhe':'ton','Klangfarbe':'farbe'};
try{store=JSON.parse(localStorage.getItem('mt')||'{}')}catch(e){}
if(!Object.keys(store).length)store={'Klasse 6a':{}};
cur=Object.keys(store)[0];
const save=()=>{try{localStorage.setItem('mt',JSON.stringify(store))}catch(e){}push()};
function rows(k){
 if(mode==='sug')return T[k].sug;
 if(mode==='blank')return T[k].start;
 const c=store[cur];return c[k]||(c[k]=T[k].start.map(r=>[...r]));
}
function draw(){
 const k=tab,cols=T[k].cols,R=rows(k),ed=mode==='class';
 $('ttl').textContent=T[k].t;
 $('who').textContent=ed?cur:mode==='blank'?'Name / Klasse: ______________________':'';
 $('note').textContent=mode==='sug'?'Vorschlag zur Anregung. Bitte mit Ihrer Aufnahme und dem Unterricht abgleichen.':'';
 let h='<thead><tr>'+cols.map((c,i)=>`<th class="col${i}">${TI[c]?`<svg aria-hidden="true" viewBox="0 0 240 240">${ICS[TI[c]]}</svg>`:''}<span>${c}</span></th>`).join('')+(ed?'<th class="ctl no-print"></th>':'')+'</tr></thead><tbody>';
 R.forEach((r,ri)=>{h+='<tr>'+cols.map((c,ci)=>`<td${ed?` contenteditable="true" data-r="${ri}" data-c="${ci}"`:''}>${esc(r[ci]||'')}</td>`).join('')+(ed?`<td class="ctl no-print"><button data-del="${ri}" aria-label="Zeile löschen">✕</button></td>`:'')+'</tr>'});
 if(mode==='blank')for(let i=0;i<2;i++)h+='<tr>'+cols.map(()=>'<td>&nbsp;</td>').join('')+'</tr>';
 $('tbl').innerHTML=h+'</tbody>';
 document.body.classList.toggle('bw',bw);$('bw').classList.toggle('on',bw);$('tH').classList.toggle('on',k==='h');$('tF').classList.toggle('on',k==='f');
 ['mClass','mSug','mBlank'].forEach(i=>$(i).classList.remove('on'));
 $({class:'mClass',sug:'mSug',blank:'mBlank'}[mode]).classList.add('on');
 $('panel').hidden=!ed;$('cls').hidden=!ed;
}
$('tbl').addEventListener('input',e=>{const t=e.target.closest('td[data-r]');if(!t)return;const r=rows(tab)[+t.dataset.r];while(r.length<=+t.dataset.c)r.push('');r[+t.dataset.c]=t.textContent;save()});
$('tbl').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;rows(tab).splice(+b.dataset.del,1);save();draw()});
$('addRow').onclick=()=>{rows(tab).push(['']);save();draw()};
function fillCls(){$('cls').innerHTML=Object.keys(store).sort((a,b)=>a.localeCompare(b,'de',{numeric:true})).map(n=>`<option${n===cur?' selected':''}>${esc(n)}</option>`).join('')}
$('cls').onchange=e=>{cur=e.target.value;draw()};
$('mk').onclick=()=>{const n=$('newCls').value.trim();if(!n||store[n])return;store[n]={};cur=n;$('newCls').value='';save();fillCls();draw()};
$('tH').onclick=()=>{tab='h';draw()};$('tF').onclick=()=>{tab='f';draw()};
$('mClass').onclick=()=>{mode='class';draw()};$('mSug').onclick=()=>{mode='sug';draw()};$('mBlank').onclick=()=>{mode='blank';draw()};
$('print').onclick=()=>window.print();
$('bw').onclick=()=>{bw=!bw;draw()};
const enc=o=>'MT1-'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
$('gen').onclick=()=>{$('code').value=enc({n:cur,d:store[cur]});$('msg').textContent='Code für „'+cur+'“ erzeugt.'};
$('cpy').onclick=async()=>{const t=$('code');t.select();try{await navigator.clipboard.writeText(t.value);$('msg').textContent='Kopiert.'}catch(e){try{document.execCommand('copy');$('msg').textContent='Kopiert.'}catch(_){$('msg').textContent='Bitte den Text markieren und manuell kopieren.'}}};
$('ld').onclick=()=>{try{const v=$('code').value.trim();if(!v.startsWith('MT1-'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));if(!o.n||typeof o.d!=='object')throw 0;store[o.n]=o.d;cur=o.n;save();fillCls();draw();$('msg').textContent='Geladen: '+o.n}catch(e){$('msg').textContent='Code nicht lesbar.'}};
let REF=null,wT=0,busy=false,dirty=false;
const SK=n=>Object.keys(n).sort((a,b)=>a.localeCompare(b,'de',{numeric:true}));
const setSync=k=>{const e=$('sync');if(e)e.textContent={cloud:'☁ Im Claude-Konto gespeichert',local:'Nur auf diesem Gerät gespeichert (nicht angemeldet)',err:'Konto-Speicherung fehlgeschlagen, lokal gesichert',load:'Verbinde mit Claude-Konto …'}[k]||''};
function push(){if(!REF)return;dirty=true;clearTimeout(wT);wT=setTimeout(flush,700)}
async function flush(){if(busy){wT=setTimeout(flush,500);return}if(!dirty)return;dirty=false;busy=true;try{await REF.set({s:JSON.stringify(store),t:Date.now()});setSync('cloud')}catch(e){setSync('err')}busy=false}
function applyRemote(str){let r;try{r=JSON.parse(str)}catch(e){return}
 if(!r||typeof r!=='object'||!Object.keys(r).length||JSON.stringify(r)===JSON.stringify(store))return;
 const ae=document.activeElement;if(ae&&ae.isContentEditable)return;
 store=r;if(!store[cur])cur=SK(store)[0];try{localStorage.setItem('mt',JSON.stringify(store))}catch(e){}fillCls();draw()}
let delArm=false;
$('delc').onclick=()=>{if(Object.keys(store).length<2){$('msg').textContent='Die letzte Klasse kann nicht gelöscht werden.';return}
 if(!delArm){delArm=true;$('delc').textContent='Wirklich löschen: '+cur+'?';setTimeout(()=>{delArm=false;$('delc').textContent='Klasse löschen'},4000);return}
 delete store[cur];cur=SK(store)[0];delArm=false;$('delc').textContent='Klasse löschen';sel=null;save();fillCls();draw()};
(async()=>{try{
 if(!(window.claude&&window.claude.use)){setSync('local');return}
 setSync('load');
 const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
 const id=(d&&u)?await u.id():null; if(!id){setSync('local');return}
 REF=d.doc('data/users/'+id+'/mappe');
 REF.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites)return;if(snap.exists){applyRemote(snap.data().s);setSync('cloud')}else{dirty=true;flush()}},()=>setSync('err'));
}catch(e){setSync('local')}})();
fillCls();draw();
</script>
<script src="legal.js"></script>
</body>
</html>
